name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      # One platform failing (often a transient Zig-mirror outage during
      # setup, not our code) shouldn't cancel the other four -- we want to
      # see every platform's real result independently.
      fail-fast: false
      matrix:
        include:
          # zig-host is the arch-os slug of the runner itself (each entry
          # builds natively), used to fetch the matching Zig 0.15.2 build
          # from ziglang.org.
          - target: aarch64-apple-darwin
            os: macos-14
            npm-dir: darwin-arm64
            bin-name: ah
            zig-host: aarch64-macos
          # Built on macos-14 (Apple Silicon), not macos-13: GitHub is
          # deprecating the Intel runners and they can sit queued for a very
          # long time or never schedule. Apple's toolchain and Zig both
          # cross-compile arm64->x86_64 natively (build.rs passes
          # -Dtarget=x86_64-macos via the Rust target), so the Intel host
          # isn't needed. zig-host is the runner's own arch (aarch64-macos).
          - target: x86_64-apple-darwin
            os: macos-14
            npm-dir: darwin-x64
            bin-name: ah
            zig-host: aarch64-macos
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            npm-dir: linux-x64
            bin-name: ah
            zig-host: x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            npm-dir: linux-arm64
            bin-name: ah
            zig-host: aarch64-linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm-dir: win32-x64
            bin-name: ah.exe
            zig-host: x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # build.rs compiles libghostty-vt with Zig, pinned to 0.15.2 (the
      # commit's minimum_zig_version). We download the official build
      # directly instead of using mlugg/setup-zig: that action's only
      # non-mirror fallback is ziglang.org/builds/, which serves master
      # nightlies, not tagged releases -- so for a pinned release version
      # it depends entirely on community mirrors, and an outage there
      # (observed 5xx across every mirror at once) fails the whole release.
      # curl --retry against the canonical release URL has no such single
      # point of failure. We set $ZIG (which build.rs reads) to an absolute
      # path rather than touching PATH, so it works regardless of the shell
      # the later cargo step runs in (pwsh on Windows).
      - name: Install Zig 0.15.2 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SLUG="${{ matrix.zig-host }}"
          FILE="zig-${SLUG}-0.15.2.tar.xz"
          echo "Downloading $FILE"
          curl -fL --retry 6 --retry-all-errors --retry-delay 10 \
            -o "$FILE" "https://ziglang.org/download/0.15.2/$FILE"
          mkdir -p "$HOME/zig-install"
          tar -xf "$FILE" -C "$HOME/zig-install"
          ZIG_DIR="$HOME/zig-install/zig-${SLUG}-0.15.2"
          echo "ZIG=$ZIG_DIR/zig" >> "$GITHUB_ENV"
          "$ZIG_DIR/zig" version

      # Separate step: on the Windows runner `bash` is Git-Bash, whose `tar`
      # is GNU tar and can't extract a .zip. Use PowerShell's native
      # Expand-Archive instead, and set $ZIG to a Windows-style absolute path
      # so build.rs's std::process::Command can exec it regardless of shell.
      - name: Install Zig 0.15.2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $slug = '${{ matrix.zig-host }}'
          $file = "zig-$slug-0.15.2.zip"
          Write-Host "Downloading $file"
          curl.exe -fL --retry 6 --retry-all-errors --retry-delay 10 `
            -o $file "https://ziglang.org/download/0.15.2/$file"
          Expand-Archive -Path $file -DestinationPath "$env:USERPROFILE\zig-install" -Force
          $zigExe = "$env:USERPROFILE\zig-install\zig-$slug-0.15.2\zig.exe"
          & $zigExe version
          "ZIG=$zigExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # bindgen (used by build.rs to generate libghostty-vt's Rust bindings)
      # needs libclang at build time. macOS/Linux runners already have it
      # via Xcode CLT / apt-installed clang; windows-latest does not expose
      # it where clang-sys looks by default, so it must be installed and
      # pointed to explicitly here.
      - if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary into npm platform package
        shell: bash
        run: |
          mkdir -p npm/${{ matrix.npm-dir }}/bin
          cp target/${{ matrix.target }}/release/${{ matrix.bin-name }} npm/${{ matrix.npm-dir }}/bin/${{ matrix.bin-name }}
          chmod +x npm/${{ matrix.npm-dir }}/bin/${{ matrix.bin-name }} || true

      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm-dir }}
          path: npm/${{ matrix.npm-dir }}/bin/${{ matrix.bin-name }}

  publish:
    needs: build
    # Only publish to npm for real release tags (v1.2.3), never for
    # pre-release tags (v1.2.3-rc1, -beta, etc.). This lets a pre-release
    # tag exercise the full cross-platform build matrix as a smoke test
    # without pushing anything to the registry -- the build job still runs
    # for every tag; only this publish step is gated.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          path: staged

      - name: Assemble platform packages
        run: |
          for dir in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            mkdir -p npm/$dir/bin
            cp staged/npm-$dir/* npm/$dir/bin/
          done
          chmod +x npm/darwin-arm64/bin/ah npm/darwin-x64/bin/ah npm/linux-x64/bin/ah npm/linux-arm64/bin/ah

      - name: Publish platform packages
        run: |
          for dir in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            npm publish ./npm/$dir --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main shim package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
