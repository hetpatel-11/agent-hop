name: Release

on:
  push:
    tags:
      - "v*"
  # Retry a publish (or a rebuild) without minting a new version tag --
  # used when a platform package is already on the registry and only the
  # remaining ones / the main shim still need to go out.
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One platform failing (often a transient Zig-mirror outage during
      # setup, not our code) shouldn't cancel the other four -- we want to
      # see every platform's real result independently.
      fail-fast: false
      matrix:
        include:
          # zig-host is the arch-os slug of the runner itself (each entry
          # builds natively), used to fetch the matching Zig 0.15.2 build
          # from ziglang.org.
          - target: aarch64-apple-darwin
            os: macos-14
            npm-dir: darwin-arm64
            bin-name: ah
            zig-host: aarch64-macos
          # Built on macos-14 (Apple Silicon), not macos-13: GitHub is
          # deprecating the Intel runners and they can sit queued for a very
          # long time or never schedule. Apple's toolchain and Zig both
          # cross-compile arm64->x86_64 natively (build.rs passes
          # -Dtarget=x86_64-macos via the Rust target), so the Intel host
          # isn't needed. zig-host is the runner's own arch (aarch64-macos).
          - target: x86_64-apple-darwin
            os: macos-14
            npm-dir: darwin-x64
            bin-name: ah
            zig-host: aarch64-macos
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            npm-dir: linux-x64
            bin-name: ah
            zig-host: x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            npm-dir: linux-arm64
            bin-name: ah
            zig-host: aarch64-linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm-dir: win32-x64
            bin-name: ah.exe
            zig-host: x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The release build is dominated by compiling the Rust dependency tree
      # (ort/ONNX, tokenizers, reqwest, ratatui, ...) from scratch -- ~6.5min
      # on Windows with a cold cache. rust-cache restores ~/.cargo and the
      # compiled deps in target/, and we add target/ghostty-vt-src so the
      # downloaded Ghostty source + Zig-built libghostty-vt (the heavy C++
      # simdutf/highway compile) are cached too. Keyed to include build.rs's
      # hash so bumping GHOSTTY_COMMIT invalidates the vt cache. This
      # workflow only runs on release tags, so the payoff is release-over-
      # release (deps rarely change between tags), not the very first run.
      - uses: Swatinem/rust-cache@v2
        with:
          # Per-target bucket: matrix jobs share the job name and differ only
          # by --target (passed on the CLI, which rust-cache doesn't see), so
          # without this their caches would collide.
          #
          # Only the Rust dependency tree is cached (rust-cache's default
          # ~/.cargo + target/ deps) -- that's the bulk of the build time.
          # We deliberately do NOT cache the Ghostty source or Zig build
          # caches: Zig's cache + fetched-package state doesn't survive
          # archive/restore (a restored copy panics with "unable to find
          # named lazypath 'tables.zig'"), so libghostty-vt is rebuilt each
          # run from a fresh Zig cache kept outside target/ (see build.rs).
          key: ${{ matrix.target }}

      # Cache the Zig toolchain itself (download + extract, ~1min on Windows)
      # so repeat runs skip re-fetching it. The install steps below check for
      # a restored copy before downloading.
      - name: Cache Zig 0.15.2
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: zig-toolchain
          key: zig-0.15.2-${{ matrix.zig-host }}

      # build.rs compiles libghostty-vt with Zig, pinned to 0.15.2 (the
      # commit's minimum_zig_version). We download the official build
      # directly instead of using mlugg/setup-zig: that action's only
      # non-mirror fallback is ziglang.org/builds/, which serves master
      # nightlies, not tagged releases -- so for a pinned release version
      # it depends entirely on community mirrors, and an outage there
      # (observed 5xx across every mirror at once) fails the whole release.
      # curl --retry against the canonical release URL has no such single
      # point of failure. We set $ZIG (which build.rs reads) to an absolute
      # path rather than touching PATH, so it works regardless of the shell
      # the later cargo step runs in (pwsh on Windows).
      - name: Install Zig 0.15.2 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SLUG="${{ matrix.zig-host }}"
          DIR="zig-toolchain/zig-${SLUG}-0.15.2"
          if [ ! -x "$DIR/zig" ]; then
            FILE="zig-${SLUG}-0.15.2.tar.xz"
            echo "Downloading $FILE"
            curl -fL --retry 6 --retry-all-errors --retry-delay 10 \
              -o "$FILE" "https://ziglang.org/download/0.15.2/$FILE"
            mkdir -p zig-toolchain
            tar -xf "$FILE" -C zig-toolchain
          else
            echo "Using cached Zig at $DIR"
          fi
          echo "ZIG=$PWD/$DIR/zig" >> "$GITHUB_ENV"
          "$PWD/$DIR/zig" version

      # Separate step: on the Windows runner `bash` is Git-Bash, whose `tar`
      # is GNU tar and can't extract a .zip. Use PowerShell's native
      # Expand-Archive instead, and set $ZIG to a Windows-style absolute path
      # so build.rs's std::process::Command can exec it regardless of shell.
      - name: Install Zig 0.15.2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $slug = '${{ matrix.zig-host }}'
          $dir = "zig-toolchain\zig-$slug-0.15.2"
          if (-not (Test-Path "$dir\zig.exe")) {
            $file = "zig-$slug-0.15.2.zip"
            Write-Host "Downloading $file"
            curl.exe -fL --retry 6 --retry-all-errors --retry-delay 10 `
              -o $file "https://ziglang.org/download/0.15.2/$file"
            Expand-Archive -Path $file -DestinationPath zig-toolchain -Force
          } else {
            Write-Host "Using cached Zig at $dir"
          }
          $zigExe = "$PWD\$dir\zig.exe"
          & $zigExe version
          "ZIG=$zigExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # bindgen (used by build.rs to generate libghostty-vt's Rust bindings)
      # needs libclang at build time. macOS/Linux runners already have it
      # via Xcode CLT / apt-installed clang; windows-latest does not expose
      # it where clang-sys looks by default, so it must be installed and
      # pointed to explicitly here.
      - if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary into npm platform package
        shell: bash
        run: |
          mkdir -p npm/${{ matrix.npm-dir }}/bin
          cp target/${{ matrix.target }}/release/${{ matrix.bin-name }} npm/${{ matrix.npm-dir }}/bin/${{ matrix.bin-name }}
          chmod +x npm/${{ matrix.npm-dir }}/bin/${{ matrix.bin-name }} || true

      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm-dir }}
          path: npm/${{ matrix.npm-dir }}/bin/${{ matrix.bin-name }}

  publish:
    needs: build
    # Only publish to npm for real release tags (v1.2.3), never for
    # pre-release tags (v1.2.3-rc1, -beta, etc.). This lets a pre-release
    # tag exercise the full cross-platform build matrix as a smoke test
    # without pushing anything to the registry -- the build job still runs
    # for every tag; only this publish step is gated.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          path: staged

      - name: Assemble platform packages
        run: |
          for dir in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            mkdir -p npm/$dir/bin
            cp staged/npm-$dir/* npm/$dir/bin/
          done
          chmod +x npm/darwin-arm64/bin/ah npm/darwin-x64/bin/ah npm/linux-x64/bin/ah npm/linux-arm64/bin/ah

      - name: Publish platform packages
        run: |
          set -euo pipefail
          publish_one() {
            local dir="$1"
            local name ver
            name=$(node -p "require('./npm/${dir}/package.json').name")
            ver=$(node -p "require('./npm/${dir}/package.json').version")
            if npm view "${name}@${ver}" version >/dev/null 2>&1; then
              echo "skip ${name}@${ver} -- already on the registry"
              return 0
            fi
            # First-time package names can trip npm's spam filter (we hit this
            # on agent-hop-win32-x64). Retry a few times before failing the job.
            local attempt
            for attempt in 1 2 3 4 5; do
              if npm publish "./npm/${dir}" --access public; then
                return 0
              fi
              echo "publish ${name}@${ver} failed (attempt ${attempt}); waiting 30s"
              sleep 30
            done
            echo "giving up on ${name}@${ver}"
            return 1
          }
          failed=0
          for dir in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            if ! publish_one "$dir"; then
              failed=1
            fi
          done
          # Main shim publishes even if one platform name is still blocked,
          # so mac/linux installs aren't held hostage by a Windows spam filter.
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "${name}@${ver}" version >/dev/null 2>&1; then
            echo "skip ${name}@${ver} -- already on the registry"
          else
            npm publish --access public
          fi
          exit "$failed"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
