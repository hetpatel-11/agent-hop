[package]
name = "agent-hop"
version = "0.1.4"
edition = "2024"
description = "Runtime for coding-agent harnesses. Run Claude Code, Codex, OpenCode, Pi, Grok, Cursor, Copilot, Gemini, and Droid in one terminal; hop live between them; search and resume any local session."

[[bin]]
name = "ah"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
dirs = "5"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "tls-rustls"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
regex = "1"
libc = "0.2"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[build-dependencies]
bindgen = "0.70"
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = "1"
tar = "0.4"
